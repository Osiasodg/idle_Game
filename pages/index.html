<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">

        <!-- header -->
        <div class="head">
            <div class="image">
                <div class="logo">
                    <img src="/images/شاف.jpeg" alt="">
                </div>
            </div>
            <div class="stat-box title">
                <h1>LE CUISTO</h1>
            </div>
            <div class="stat-box">
                <div class="stat-icon"><img class="icon" src="/images/grain.jpeg" alt=""></div>
                <div class="count">
                    <span>0</span>
                    <span >Grains</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-icon"><img class="icon" src="/images/rise.jpeg" alt=""></div>
                <div class="count">
                    <span>0</span>
                    <span>Plats</span>
                </div>
                
            </div>
            <div class="stat-box">
                <div class="stat-icon"><img class="icon" src="/images/level.jpeg" alt=""></div>
                <div class="count">
                    <span>Niveau <span id="level">1</span></span>
                </div>
            </div>
        </div>

        <!-- corp du jeux -->
        <div class="game_sapace">
            <div class="bloc_left">
                <div class="bloc_left_description">
                    <h2>⚙️ AMÉLIORATIONS</h2>
                </div>
                <div class="option">
                    <div class="icone_bloc"><img src="/images/cuisinier.jpeg" alt=""></div>
                    <div class="description"></div>
                </div>
                <div class="option">
                    <div class="icone_bloc"><img src="/images/machine cuisson.jpeg" alt=""></div>
                    <div class="description"></div>
                </div>
                <div class="option">
                    <div class="icone_bloc"><img src="/images/robot.jpeg" alt=""></div>
                    <div class="description"></div>
                </div>

                <div class="option">
                    <div class="icone_bloc"><img src="/images/usine.jpeg" alt=""></div>
                    <div class="description"></div>
                </div>
                <div class="option button"><button>Acheter</button></div>
                
            </div>
            <div class="bloc_center"></div>
            <div class="bloc_right">
                
            </div>
        </div>

        <!-- footer -->
        <div class="foot">
        </div>
    </div>
</body>
</html>
